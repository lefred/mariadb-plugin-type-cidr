name: Build and package TYPE_CIDR plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: type-cidr
      plugin_directory: type_cidr
      build_target: type_cidr
      plugin_library: type_cidr.so

      mariadb_versions: |
          13.0.2
          13.1.1
          
      cmake_options: -DPLUGIN_TYPE_CIDR=DYNAMIC
      test_suite: type_cidr
      run_tests: false
